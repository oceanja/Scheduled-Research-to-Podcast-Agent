[project]
name = "daily-brief-backend"
version = "0.1.0"
description = "Scheduled research-to-podcast agent — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "google-genai>=0.3.0",
    "tavily-python>=0.5.0",
    "pydub>=0.25.1",
    "supabase>=2.9.0",
    "resend>=2.4.0",
    "tenacity>=9.0.0",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
